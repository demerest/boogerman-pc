<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>s70 disasm</title></head>
<body>
<pre id="out">waiting</pre>
<script>document.write('<script src="../../web/rom/' + (new URLSearchParams(location.search).get('rom') === 'eu' ? 'boogerman.gen.js' : 'boogerman_us.gen.js') + '"><\/script>');</script>
<script src="../../web/js/util.js"></script>
<script>
(function () {
  const rom = BP.util.b64ToBytes(window.BP_ROM_B64);
  const q = new URLSearchParams(location.search);
  const out = [];
  const hx = (v, n) => v.toString(16).toUpperCase().padStart(n, '0');
  const w = a => (rom[a] << 8) | rom[a + 1];
  const l = a => (w(a) << 16) | w(a + 2);
  const s8 = v => v < 128 ? v : v - 256;
  const s16 = v => v < 32768 ? v : v - 65536;
  const DR = ['D0','D1','D2','D3','D4','D5','D6','D7'];
  const AR = ['A0','A1','A2','A3','A4','A5','A6','A7'];
  const SZ = ['B','W','L'];
  const CC = ['T','F','HI','LS','CC','CS','NE','EQ','VC','VS','PL','MI','GE','LT','GT','LE'];
  function ea(mode, reg, size, pc) {
    let n = 0, t = '';
    const ext = () => { const v = w(pc + n); n += 2; return v; };
    switch (mode) {
      case 0: t = DR[reg]; break;
      case 1: t = AR[reg]; break;
      case 2: t = '(' + AR[reg] + ')'; break;
      case 3: t = '(' + AR[reg] + ')+'; break;
      case 4: t = '-(' + AR[reg] + ')'; break;
      case 5: t = '(' + s16(ext()) + ',' + AR[reg] + ')'; break;
      case 6: { const x = ext(); const ir = (x >> 15) & 1; const rn = (x >> 12) & 7;
        const sc = (x >> 9) & 3; const wl = (x >> 11) & 1;
        t = '(' + s8(x & 255) + ',' + AR[reg] + ',' + (ir ? AR[rn] : DR[rn]) + '.' + (wl ? 'L' : 'W') + (sc ? '*' + (1 << sc) : '') + ')'; break; }
      case 7: switch (reg) {
        case 0: t = '(' + hx(s16(ext()), 4) + ').W'; break;
        case 1: t = '(' + hx(l(pc + n), 6) + ').L'; n += 4; break;
        case 2: t = '(' + s16(ext()) + ',PC)'; break;
        case 3: { const x = ext(); const ir = (x >> 15) & 1; const rn = (x >> 12) & 7;
          t = '(' + s8(x & 255) + ',PC,' + (ir ? AR[rn] : DR[rn]) + '.' + ((x >> 11) & 1 ? 'L' : 'W') + ')'; break; }
        case 4: { const im = size === 2 ? (n += 4, l(pc + n - 4)) : (size === 0 ? (ext() & 255) : ext());
          t = '#' + hx(im, size === 2 ? 8 : size === 0 ? 2 : 4); break; }
      } break;
    }
    return { t, n };
  }
  function reglist(mask, predec) {
    const r = [];
    for (let i = 0; i < 16; i++) if (mask & (1 << i)) r.push(i < 8 ? DR[i] : AR[i - 8]);
    if (predec) r.reverse();
    return r.join('/');
  }
  function dis(a) {
    const op = w(a); let n = 2, t = '';
    const m = (op >> 6) & 7, r = (op >> 9) & 7, rm = op & 7, mm = (op >> 3) & 7;
    const size = (op >> 6) & 3;
    const E = (mode, reg, sz) => { const e = ea(mode, reg, sz, a + n); n += e.n; return e.t; };
    const top = op >> 12;
    if (op === 0x4E71) t = 'NOP';
    else if (op === 0x4E75) t = 'RTS';
    else if (op === 0x4E73) t = 'RTE';
    else if (op === 0x4E77) t = 'RTR';
    else if (op === 0x4E70) t = 'RESET';
    else if (op === 0x4E72) { t = 'STOP #' + hx(w(a + n), 4); n += 2; }
    else if (op === 0x4AFC) t = 'ILLEGAL';
    else if ((op & 0xFFF0) === 0x4E40) t = 'TRAP #' + (op & 15);
    else if ((op & 0xFFF8) === 0x4E50) { t = 'LINK ' + AR[rm] + ',#' + s16(w(a + n)); n += 2; }
    else if ((op & 0xFFF8) === 0x4E58) t = 'UNLK ' + AR[rm];
    else if ((op & 0xFFF0) === 0x4E60) t = 'MOVE ' + (op & 8 ? 'USP,' + AR[rm] : AR[rm] + ',USP');
    else if ((op & 0xFFC0) === 0x4EC0) t = 'JMP ' + E(mm, rm, 2);
    else if ((op & 0xFFC0) === 0x4E80) t = 'JSR ' + E(mm, rm, 2);
    else if ((op & 0xFFC0) === 0x41C0) t = 'LEA ' + E(mm, rm, 2) + ',' + AR[r];
    else if ((op & 0xFFC0) === 0x4840 && mm >= 2) t = 'PEA ' + E(mm, rm, 2);
    else if ((op & 0xFFC0) === 0x4840 && mm === 0) t = 'SWAP ' + DR[rm];
    else if ((op & 0xFFC0) === 0x4880 && mm === 0) t = 'EXT.W ' + DR[rm];
    else if ((op & 0xFFC0) === 0x48C0 && mm === 0) t = 'EXT.L ' + DR[rm];
    else if ((op & 0xFB80) === 0x4880) { const sz = (op >> 6) & 1 ? 2 : 1; const mask = w(a + n); n += 2;
      const e = E(mm, rm, sz); t = 'MOVEM.' + SZ[sz] + ' ' + reglist(mask, mm === 4) + ',' + e; }
    else if ((op & 0xFB80) === 0x4C80) { const sz = (op >> 6) & 1 ? 2 : 1; const e = E(mm, rm, sz); const mask = w(a + n); n += 2;
      t = 'MOVEM.' + SZ[sz] + ' ' + e + ',' + reglist(mask, false); }
    else if ((op & 0xF1C0) === 0x4180) t = 'CHK ' + E(mm, rm, 1) + ',' + DR[r];
    else if ((op & 0xF000) === 0x6000) { const c = (op >> 8) & 15; let d = s8(op & 255); let tgt;
      if (op & 255) tgt = a + 2 + d; else { d = s16(w(a + n)); n += 2; tgt = a + 2 + d; }
      t = (c === 0 ? 'BRA' : c === 1 ? 'BSR' : 'B' + CC[c]) + '.' + ((op & 255) ? 'S' : 'W') + ' ' + hx(tgt, 6); }
    else if ((op & 0xF0F8) === 0x50C8) { const c = (op >> 8) & 15; t = 'DB' + CC[c] + ' ' + DR[rm] + ',' + hx(a + 2 + s16(w(a + n)), 6); n += 2; }
    else if ((op & 0xF0C0) === 0x50C0) { const c = (op >> 8) & 15; t = 'S' + CC[c] + ' ' + E(mm, rm, 0); }
    else if ((op & 0xF100) === 0x5000) { const d = ((op >> 9) & 7) || 8; const sz = (op >> 6) & 3;
      t = ((op & 0x100) ? 'SUBQ.' : 'ADDQ.') + SZ[sz] + ' #' + d + ',' + E(mm, rm, sz); }
    else if ((op & 0xF000) === 0x7000) t = 'MOVEQ #' + s8(op & 255) + ',' + DR[r];
    else if (top === 1 || top === 2 || top === 3) {
      const sz = top === 1 ? 0 : top === 3 ? 1 : 2;
      if (m === 1 && top !== 0) { t = 'MOVEA.' + SZ[sz] + ' ' + E(mm, rm, sz) + ',' + AR[r]; }
      else { const src = E(mm, rm, sz); const dst = E(m, r, sz);
        t = 'MOVE.' + SZ[sz] + ' ' + src + ',' + dst; }
    }
    else if ((op & 0xF1F8) === 0x0108) { t = 'MOVEP ' + hx(w(a + n), 4) + '(' + AR[rm] + '), ' + DR[r]; n += 2; }
    else if ((op & 0xF1F8) === 0x0148) { t = 'MOVEP ' + DR[r] + ', ' + hx(w(a + n), 4) + '(' + AR[rm] + ')'; n += 2; }
    else if ((op & 0xF100) === 0x0100) { const names = ['BTST','BCHG','BCLR','BSET']; const k = (op >> 6) & 3;
      const sz = mm === 0 ? 2 : 0; t = names[k] + ' D' + r + ',' + E(mm, rm, sz); }
    else if ((op & 0xFF00) === 0x0800) { const names = ['BTST','BCHG','BCLR','BSET']; const k = (op >> 6) & 3;
      const b = w(a + n); n += 2; const sz = mm === 0 ? 2 : 0;
      t = names[k] + ' #' + b + ',' + E(mm, rm, sz); }
    else if ((op & 0xFF3C) === 0x003C || (op & 0xFF3C) === 0x023C || (op & 0xFF3C) === 0x0A3C) {
      const names = { 0: 'ORI', 2: 'ANDI', 10: 'EORI' };
      t = names[(op >> 8) & 15] + ' #' + hx(w(a + n), 4) + ',CCR'; n += 2; }
    else if ((op & 0xFF3C) === 0x007C || (op & 0xFF3C) === 0x027C || (op & 0xFF3C) === 0x0A7C) {
      const names = { 0: 'ORI', 2: 'ANDI', 10: 'EORI' };
      t = names[(op >> 8) & 15] + ' #' + hx(w(a + n), 4) + ',SR'; n += 2; }
    else if ((op & 0xFF00) === 0x0000 || (op & 0xFF00) === 0x0200 || (op & 0xFF00) === 0x0400 ||
             (op & 0xFF00) === 0x0600 || (op & 0xFF00) === 0x0A00 || (op & 0xFF00) === 0x0C00) {
      const names = { 0: 'ORI', 2: 'ANDI', 4: 'SUBI', 6: 'ADDI', 10: 'EORI', 12: 'CMPI' };
      const k = (op >> 8) & 15; const sz = (op >> 6) & 3;
      if (sz === 3) { t = 'dc.w ' + hx(op, 4); }
      else {
        let im; if (sz === 2) { im = l(a + n); n += 4; } else { im = w(a + n); n += 2; if (sz === 0) im &= 255; }
        const dst = E(mm, rm, sz);
        t = names[k] + '.' + SZ[sz] + ' #' + hx(im, sz === 2 ? 8 : sz === 0 ? 2 : 4) + ',' + dst;
      }
    }
    else if ((op & 0xF1C0) === 0x40C0) t = 'MOVE SR,' + E(mm, rm, 1);
    else if ((op & 0xFFC0) === 0x46C0) t = 'MOVE ' + E(mm, rm, 1) + ',SR';
    else if ((op & 0xFFC0) === 0x44C0) t = 'MOVE ' + E(mm, rm, 0) + ',CCR';
    else if ((op & 0xFFC0) === 0x42C0) t = 'MOVE CCR,' + E(mm, rm, 1);
    else if ((op & 0xFFC0) === 0x4AC0) t = 'TAS ' + E(mm, rm, 0);
    else if ((op & 0xFF00) === 0x4000) t = 'NEGX.' + SZ[size] + ' ' + E(mm, rm, size);
    else if ((op & 0xFF00) === 0x4200) t = 'CLR.' + SZ[size] + ' ' + E(mm, rm, size);
    else if ((op & 0xFF00) === 0x4400) t = 'NEG.' + SZ[size] + ' ' + E(mm, rm, size);
    else if ((op & 0xFF00) === 0x4600) t = 'NOT.' + SZ[size] + ' ' + E(mm, rm, size);
    else if ((op & 0xFF00) === 0x4A00) t = 'TST.' + SZ[size] + ' ' + E(mm, rm, size);
    else if ((op & 0xF1C0) === 0x80C0) t = 'DIVU ' + E(mm, rm, 1) + ',' + DR[r];
    else if ((op & 0xF1C0) === 0x81C0) t = 'DIVS ' + E(mm, rm, 1) + ',' + DR[r];
    else if ((op & 0xF1C0) === 0xC0C0) t = 'MULU ' + E(mm, rm, 1) + ',' + DR[r];
    else if ((op & 0xF1C0) === 0xC1C0) t = 'MULS ' + E(mm, rm, 1) + ',' + DR[r];
    else if ((op & 0xF1F0) === 0xC140) t = 'EXG ' + DR[r] + ',' + DR[rm];
    else if ((op & 0xF1F0) === 0xC148) t = 'EXG ' + AR[r] + ',' + AR[rm];
    else if ((op & 0xF1F0) === 0xC188) t = 'EXG ' + DR[r] + ',' + AR[rm];
    else if ((op & 0xF100) === 0xC000) { const sz = (op >> 6) & 3; const om = (op >> 6) & 7;
      if (om === 3) t = 'ADDA.W ' + E(mm, rm, 1) + ',' + AR[r];
      else if (om === 7) t = 'ADDA.L ' + E(mm, rm, 2) + ',' + AR[r];
      else t = 'AND.' + SZ[sz] + ' ' + ((op & 0x100) ? E(mm, rm, sz) + ',' + DR[r] : DR[r] + ',' + E(mm, rm, sz)); }
    else if ((op & 0xF100) === 0xD000) { const sz = (op >> 6) & 3; const om = (op >> 6) & 7;
      if (om === 3) t = 'ADDA.W ' + E(mm, rm, 1) + ',' + AR[r];
      else if (om === 7) t = 'ADDA.L ' + E(mm, rm, 2) + ',' + AR[r];
      else t = 'ADD.' + SZ[sz] + ' ' + ((op & 0x100) ? E(mm, rm, sz) + ',' + DR[r] : DR[r] + ',' + E(mm, rm, sz)); }
    else if ((op & 0xF100) === 0x9000) { const sz = (op >> 6) & 3; const om = (op >> 6) & 7;
      if (om === 3) t = 'SUBA.W ' + E(mm, rm, 1) + ',' + AR[r];
      else if (om === 7) t = 'SUBA.L ' + E(mm, rm, 2) + ',' + AR[r];
      else t = 'SUB.' + SZ[sz] + ' ' + ((op & 0x100) ? E(mm, rm, sz) + ',' + DR[r] : DR[r] + ',' + E(mm, rm, sz)); }
    else if ((op & 0xF100) === 0xB000) { const sz = (op >> 6) & 3; const om = (op >> 6) & 7;
      if (om === 3) t = 'CMPA.W ' + E(mm, rm, 1) + ',' + AR[r];
      else if (om === 7) t = 'CMPA.L ' + E(mm, rm, 2) + ',' + AR[r];
      else if (om >= 4 && om <= 6) t = 'EOR.' + SZ[sz] + ' ' + DR[r] + ',' + E(mm, rm, sz);
      else t = 'CMP.' + SZ[sz] + ' ' + E(mm, rm, sz) + ',' + DR[r]; }
    else if ((op & 0xF0C0) === 0xE0C0) { const ty = (op >> 9) & 3; const dir = (op >> 8) & 1;
      const names = ['AS','LS','ROX','RO']; t = names[ty] + (dir ? 'L' : 'R') + ' ' + E(mm, rm, 1); }
    else if ((op & 0xF018) === 0xE000) { const ty = (op >> 3) & 3; const dir = (op >> 8) & 1;
      const names = ['AS','LS','ROX','RO']; const sz = (op >> 6) & 3;
      const cnt = (op & 0x20) ? DR[r] : '#' + (((op >> 9) & 7) || 8);
      t = names[ty] + (dir ? 'L' : 'R') + '.' + SZ[sz] + ' ' + cnt + ',' + DR[rm]; }
    else t = 'dc.w ' + hx(op, 4);
    const raw = [];
    for (let i = 0; i < n; i += 2) raw.push(hx(w(a + i), 4));
    out.push(hx(a, 6) + ': ' + raw.join(' ').padEnd(20) + ' ' + t);
    return n;
  }
  if (q.get('scan')) {
    const addrs = [0x0244, 0x0254, 0x0632, 0x06D0, 0x1506, 0x0516];
    for (let a = 0; a < rom.length - 8; a += 2) {
      const op = w(a);
      if (op === 0x33FC) { const ad = l(a + 4) & 0xFFFFFF; const lo = ad & 0xFFFF;
        if (ad >= 0xFF0000 && addrs.includes(lo)) out.push(hx(a, 6) + ': MOVE.W #' + hx(w(a + 2), 4) + ',(' + hx(ad, 6) + ').L'); }
      else if (op === 0x31FC) { const ad = s16(w(a + 4)) & 0xFFFF;
        if (addrs.includes(ad)) out.push(hx(a, 6) + ': MOVE.W #' + hx(w(a + 2), 4) + ',(' + hx(ad, 4) + ').W'); }
    }
  } else {
    let a = parseInt(q.get('start') || '154C0', 16);
    const end = parseInt(q.get('end') || '15780', 16);
    while (a < end && a < rom.length - 8) a += dis(a);
  }
  document.getElementById('out').textContent = out.join('\n');
  document.title = 'DISASM DONE';
})();
</script>
</body>
