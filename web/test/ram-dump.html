<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ram dump</title></head>
<body>
<div id="out">waiting</div>
<script src="../vendor/gpgx/gpgx.web.js"></script>
<script src="../vendor/gpgx/gpgx.wasm.js"></script>
<script>
  /* s67: ?rom=us selects the region-matched US oracle dump (local-only). */
  document.write('<script src="../rom/' +
    (new URLSearchParams(location.search).get('rom') === 'us' ? 'boogerman_us.gen.js' : 'boogerman.gen.js') +
    '"><\/script>');
</script>
<script src="../js/util.js"></script>
<script src="../js/hooks.js"></script>
<script src="../js/patches.js"></script>
<script src="../js/shaders.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/input.js"></script>
<script src="../js/video.js"></script>
<script src="../js/cheats.js"></script>
<script src="../js/states.js"></script>
<script src="../js/mods.js"></script>
<script src="../js/core.js"></script>
<script>
(async function () {
  try {
    await BP.core.init({ silent: true });
    BP.core.loadGame(BP.util.b64ToBytes(window.BP_ROM_B64), 'boogerman.gen');
    const target = parseInt(new URLSearchParams(location.search).get('frames') || '180', 10);
    /* s67: optional press timeline "lrId@frame:hold,..." (LR.START=3, LR.RIGHT=7). */
    const presses = (new URLSearchParams(location.search).get('script') || '')
      .split(',').filter(Boolean).map(s => {
        const [id, rest] = s.split('@'); const [st, hold] = rest.split(':');
        return { id: parseInt(id, 10), st: parseInt(st, 10), hold: parseInt(hold || '40', 10) };
      });
    let n = 0;
    function step() {
      for (const p of presses) BP.input.setVirtual(0, p.id, n >= p.st && n < p.st + p.hold);
      BP.core.run();
      if (++n >= target) {
        const ram = BP.core.ram();
        let regs = '';
        const rd = BP.core.romdev;
        if (rd && rd.getreg) {
          for (let i = 0; i < 24; i++) {
            try { regs += i + ':' + (rd.getreg(i) >>> 0).toString(16) + ' '; }
            catch (e) { regs += i + ':err '; }
          }
        }
        document.getElementById('out').textContent =
          'RAMDUMP ' + BP.util.bytesToB64(ram) +
          ' COUNTER ' + BP.core.ramRead16(0x288).toString(16) +
          ' MARKER ' + BP.core.ramRead16(0x200).toString(16) +
          ' REGS ' + regs;
        document.title = 'RAMDUMP DONE';
        return;
      }
      setTimeout(step, 0);
    }
    setTimeout(step, 0);
  } catch (e) {
    document.getElementById('out').textContent = 'ERR ' + e.message;
  }
})();
</script>
</body>
</html>
