<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ram shot</title></head>
<body style="margin:0;background:#000">
<canvas id="shot" width="320" height="224" style="image-rendering:pixelated"></canvas>
<div id="out">waiting</div>
<script src="../vendor/gpgx/gpgx.web.js"></script>
<script src="../vendor/gpgx/gpgx.wasm.js"></script>
<script src="../rom/boogerman.gen.js"></script>
<script src="../js/util.js"></script>
<script src="../js/hooks.js"></script>
<script src="../js/patches.js"></script>
<script src="../js/shaders.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/input.js"></script>
<script src="../js/video.js"></script>
<script src="../js/cheats.js"></script>
<script src="../js/states.js"></script>
<script src="../js/mods.js"></script>
<script src="../js/core.js"></script>
<script>
(async function () {
  try {
    await BP.core.init({ silent: true });
    BP.core.loadGame(BP.util.b64ToBytes(window.BP_ROM_B64), 'boogerman.gen');
    const target = parseInt(new URLSearchParams(location.search).get('frames') || '180', 10);
    /* s57: optional press timeline "lrId@frame:hold,..." (LR.START=3, LR.B=0). */
    const presses = (new URLSearchParams(location.search).get('script') || '')
      .split(',').filter(Boolean).map(s => {
        const [id, rest] = s.split('@'); const [st, hold] = rest.split(':');
        return { id: parseInt(id, 10), st: parseInt(st, 10), hold: parseInt(hold || '40', 10) };
      });
    const modes = []; let prevMode = -1;
    const gates = [];
    const gateFrames = [900, 1000, 1050, 1100, 1150, 1200, 1400, 1800, 2399];
    /* web ram() is little-endian per word: ramRead16 returns byte-swapped words. */
    const sw = v => ((v & 0xFF) << 8) | (v >> 8);
    const rb = a => (a & 1) ? BP.core.ramRead16(a - 1) >> 8 : BP.core.ramRead16(a) & 0xFF;
    let n = 0;
    function step() {
      for (const p of presses) BP.input.setVirtual(0, p.id, n >= p.st && n < p.st + p.hold);
      BP.core.run();
      const m = sw(BP.core.ramRead16(0x516));
      const boring = x => x === 0 || x === 4 || x === 8;
      if (m !== prevMode && (!boring(m) || !boring(prevMode))) { modes.push(n + ':' + m.toString(16)); prevMode = m; }
      else if (m !== prevMode) prevMode = m;
      if (gateFrames.includes(n))
        gates.push(n + '[' + rb(0x5D4).toString(16) + ' ' + rb(0xA65).toString(16) + ' ' +
          sw(BP.core.ramRead16(0x2BA)).toString(16) + ' ' + sw(BP.core.ramRead16(0x284)).toString(16) + ' ' +
          sw(BP.core.ramRead16(0x25E)).toString(16) + ' ' + sw(BP.core.ramRead16(0x246)).toString(16) + ']');
      if (++n >= target) {
        const lv = BP.core.lastVideo;
        const U8 = BP.core.heapU8();
        const c = document.getElementById('shot');
        c.width = lv.width; c.height = lv.height;
        const ctx = c.getContext('2d');
        const img = ctx.createImageData(lv.width, lv.height);
        const D = img.data;
        for (let y = 0; y < lv.height; y++) {
          let s = lv.ptr + y * lv.pitch;
          let d = y * lv.width * 4;
          for (let x = 0; x < lv.width; x++) {
            const v = U8[s] | (U8[s + 1] << 8); s += 2;
            const r = (v >> 11) & 31, g = (v >> 5) & 63, b = v & 31;
            D[d] = (r << 3) | (r >> 2);
            D[d + 1] = (g << 2) | (g >> 4);
            D[d + 2] = (b << 3) | (b >> 2);
            D[d + 3] = 255;
            d += 4;
          }
        }
        ctx.putImageData(img, 0, 0);
        let regs = '';
        const rd = BP.core.romdev;
        if (rd && rd.getreg) {
          for (let i = 0; i < 24; i++) {
            try { regs += i + ':' + (rd.getreg(i) >>> 0).toString(16) + ' '; }
            catch (e) { regs += i + ':err '; }
          }
        }
        document.getElementById('out').textContent = 'SHOTDONE ' + regs +
          ' MODES ' + modes.join(',') + ' GATES ' + gates.join(' ');
        document.title = 'SHOT DONE';
        return;
      }
      setTimeout(step, 0);
    }
    setTimeout(step, 0);
  } catch (e) {
    document.getElementById('out').textContent = 'ERR ' + e.message;
  }
})();
</script>
</body>
</html>
